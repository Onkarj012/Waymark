# Content worker — public page views (GET /p/{id}), the house theme
# (GET /theme.css), and the index/discovery routes. Must be deployed on a
# distinct origin/domain from wrangler.control.toml's worker (see AGENTS.md
# "Conventions & invariants"). This worker never handles a bearer token or
# admin cookie.
#
# Setup: docs/self-hosting/cloudflare-workers.md

name = "waymark-content"
main = "src/content.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Keep the *.workers.dev host enabled: it serves the legacy 308 redirect for
# links shared before the custom domain existed (see WAYMARK_LEGACY_HOSTS).
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "waymark"
database_id = "10362e6d-3e3d-40aa-bf0e-074197615a07"
migrations_dir = "migrations"

[vars]
PUBLIC_BASE_URL = "https://waymark.leo4.dev"
CONTROL_BASE_URL = "https://waymark-api.leo4.dev"
WAYMARK_LEGACY_HOSTS = "waymark-content.leoeccentric.workers.dev"

[[routes]]
pattern = "waymark.leo4.dev"
custom_domain = true
